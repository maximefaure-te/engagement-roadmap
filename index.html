<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engagement Roadmap</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }

nav {
  display: flex;
  align-items: center;
  padding: 0 28px;
  background: #fff;
  border-bottom: 1px solid #d4cec4;
  height: 44px;
}
.nav-brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #1a1a1a;
  margin-right: 24px;
  text-decoration: none;
}
.nav-tab {
  display: inline-flex;
  align-items: center;
  height: 44px;
  padding: 0 16px;
  font-size: 12px;
  font-family: inherit;
  color: #666;
  text-decoration: none;
  border-bottom: 2px solid transparent;
  transition: color 0.12s, border-color 0.12s;
  letter-spacing: 0.02em;
}
.nav-tab:hover { color: #1a1a1a; }
.nav-tab.active {
  color: #E3120B;
  border-bottom-color: #E3120B;
  font-weight: 600;
}

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: #f2ede3;
  color: #1a1a1a;
  padding: 0;
  min-height: 100vh;
  font-size: 14px;
}

.page-content {
  padding: 24px 28px;
}

.page-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 20px;
}

h1 {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #1a1a1a;
}

.subtitle {
  font-size: 12px;
  color: #888;
  font-style: italic;
}

.controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 7px;
}
.filter-label {
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
select {
  padding: 7px 10px;
  border: 1px solid #c8c0b0;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: #fff;
  color: #1a1a1a;
  cursor: pointer;
}
select:focus { outline: 1px solid #E3120B; }


.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  background: #faf7f0;
  border: 1px solid #c8c0b0;
  table-layout: fixed;
}

col.lane-col    { width: 180px; }
col.horizon-col { width: auto; }

thead tr th {
  padding: 10px 14px;
  text-align: left;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  background: #f2ede3;
  border-bottom: 1px solid #c8c0b0;
  vertical-align: bottom;
}

th.h-now     { color: #2f7a2f; border-top: 3px solid #2f7a2f; }
th.h-next    { color: #b86d00; border-top: 3px solid #b86d00; }
th.h-later   { color: #E3120B; border-top: 3px solid #E3120B; }
th.h-lane    { color: #1a1a1a; border-top: 3px solid transparent; }

tbody tr { border-bottom: 1px dashed #c8c0b0; }
tbody tr:last-child { border-bottom: none; }

/* Zone header rows */
td.zone-header {
  padding: 9px 16px;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #fff;
  background: #1a1a1a;
  border-top: 2px solid #c8c0b0;
  border-bottom: none;
}
td.zone-header.z-strategic    { border-left: 5px solid #E3120B; }
td.zone-header.z-operational  { border-left: 5px solid #2f7a2f; }
td.zone-header.z-enterprise   { border-left: 5px solid #b86d00; }

tr.zone-row td.lane-cell { background: #f5f0e8; }

td.lane-cell {
  padding: 11px 14px;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  vertical-align: top;
  border-right: 1px solid #c8c0b0;
  background: #f2ede3;
  white-space: normal;
  word-wrap: break-word;
  color: #444;
}

/* Zone-tinted lane cells */
.zone-strategic  td.lane-cell { border-left: 3px solid #E3120B; }
.zone-operational td.lane-cell { border-left: 3px solid #2f7a2f; }
.zone-enterprise td.lane-cell { border-left: 3px solid #b86d00; }

.lane-count {
  display: inline-block;
  background: #ddd8cc;
  color: #777;
  font-size: 10px;
  font-weight: normal;
  padding: 1px 5px;
  border-radius: 9px;
  margin-left: 4px;
  vertical-align: middle;
}

td.feat-cell {
  padding: 11px 14px;
  vertical-align: top;
  border-right: 1px solid #e0d9cc;
}
td.feat-cell:last-child { border-right: none; }

.feat {
  font-size: 12.5px;
  line-height: 1.45;
  color: #1a1a1a;
  margin-bottom: 5px;
  padding-bottom: 5px;
  border-bottom: 1px solid #ece6d8;
}
.feat:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

.tag-pill {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 9px;
  margin-right: 5px;
  font-style: normal;
  font-weight: 600;
  letter-spacing: 0.01em;
  vertical-align: middle;
  white-space: nowrap;
}

/* Team pills */
.pill-web  { background: #ddeeff; color: #2255aa; }
.pill-disc { background: #eeddf5; color: #7733aa; }
.pill-core { background: #ddf5ee; color: #226644; }
.pill-av   { background: #fff0dd; color: #aa5500; }
.pill-ads  { background: #fff5dd; color: #886600; }

/* KR tooltip */
.feat[data-kr] { cursor: default; }

#kr-tooltip {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  display: none;
  max-width: 280px;
  background: #1a1a1a;
  color: #f5f0e8;
  font-size: 11px;
  line-height: 1.5;
  padding: 8px 11px;
  border-radius: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.22);
}
#kr-tooltip::before {
  content: "KR";
  display: block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #E3120B;
  margin-bottom: 3px;
}
</style>

// ─── HORIZON CONFIG ────────────────────────────────────────────────────────
const HORIZONS_BASE = [
  { key:"Now",    label:"Now (June–July)",    thcls:"h-now"  },
  { key:"Next",   label:"Next (August)",      thcls:"h-next" },
  { key:"Later",  label:"Later (Sept–Oct–Nov)", thcls:"h-later"}
];

// ─── TEAM PILLS ───────────────────────────────────────────────────────────
const TEAM_PILL = {
  "Web, NL, GenAI":              ["pill-web",  "Web"],
  "Discovery & Personalisation": ["pill-disc", "D&P"],
  "Core App":                    ["pill-core", "App"],
  "Audio & Video":               ["pill-av",   "A&V"],
  "Advertising":                 ["pill-ads",  "Ads"]
};

// ─── RENDER ───────────────────────────────────────────────────────────────
function render() {
  var selTeam = document.getElementById("team-select").value;
  var selObj  = document.getElementById("obj-select").value;
  var horizons = HORIZONS_BASE;

  var colgroup = "<colgroup><col class=\"lane-col\">" +
    horizons.map(function() { return "<col class=\"horizon-col\">"; }).join("") +
    "</colgroup>";

  var headerRow = "<tr><th class=\"h-lane\"></th>" +
    horizons.map(function(h) {
      return "<th class=\"" + h.thcls + "\">" + h.label + "</th>";
    }).join("") +
    "</tr>";

  var bodyRows = "";
  var anyRow = false;

  ZONES.forEach(function(zone) {
    var zoneRows = "";

    zone.lanes.forEach(function(lane) {
      // If objective filter is active and this lane doesn't match, skip entirely
      if (selObj && lane !== selObj) return;

      var cells = horizons.map(function(h) {
        return DATA.filter(function(d) {
          return d.zone === zone.key &&
                 d.lane === lane &&
                 d.r    === h.key &&
                 (!selTeam || d.t === selTeam);
        });
      });

      var total = cells.reduce(function(s, c) { return s + c.length; }, 0);
      if (total === 0) return;

      var tds = cells.map(function(items) {
        if (!items.length) return "<td class=\"feat-cell\"></td>";
        var feats = items.map(function(item) {
          var pill = "";
          if (item.t) {
            var pd = TEAM_PILL[item.t] || ["", item.t];
            pill = "<span class=\"tag-pill " + pd[0] + "\">" + pd[1] + "</span>";
          }
          var krAttr = item.kr ? " data-kr=\"" + item.kr.replace(/"/g, "&quot;") + "\"" : "";
          return "<div class=\"feat\"" + krAttr + ">" + pill + item.f + "</div>";
        }).join("");
        return "<td class=\"feat-cell\">" + feats + "</td>";
      }).join("");

      zoneRows += "<tr class=\"" + zone.rowcls + "\"><td class=\"lane-cell\">" +
        lane + "<span class=\"lane-count\">" + total + "</span></td>" + tds + "</tr>";
    });

    // Only render zone header if it has visible lanes
    if (zoneRows) {
      bodyRows += "<tr><td class=\"zone-header " + zone.cls + "\" colspan=\"" +
        (horizons.length + 1) + "\">" + zone.label + "</td></tr>";
      bodyRows += zoneRows;
      anyRow = true;
    }
  });

  if (!anyRow) {
    bodyRows = "<tr><td class=\"feat-cell\" style=\"padding:40px;text-align:center;color:#aaa;font-style:italic;\" colspan=\"" +
      (horizons.length + 1) + "\">No features match the current filter.</td></tr>";
  }

  document.getElementById("table-wrap").innerHTML =
    "<table>" + colgroup + "<thead>" + headerRow + "</thead><tbody>" + bodyRows + "</tbody></table>";
}

document.getElementById("team-select").addEventListener("change", render);
document.getElementById("obj-select").addEventListener("change", render);
render();

// ─── KR TOOLTIP ──────────────────────────────────────────────────────────
(function() {
  var tip = document.getElementById("kr-tooltip");
  var OFFSET = 12;

  document.getElementById("table-wrap").addEventListener("mouseover", function(e) {
    var el = e.target.closest(".feat[data-kr]");
    if (!el) return;
    tip.textContent = el.dataset.kr;
    tip.style.display = "block";
  });

  document.getElementById("table-wrap").addEventListener("mousemove", function(e) {
    var el = e.target.closest(".feat[data-kr]");
    if (!el) { tip.style.display = "none"; return; }
    var x = e.clientX + OFFSET;
    var y = e.clientY + OFFSET;
    if (x + 290 > window.innerWidth)  x = e.clientX - 290 - OFFSET;
    if (y + 60  > window.innerHeight) y = e.clientY - 60  - OFFSET;
    tip.style.left = x + "px";
    tip.style.top  = y + "px";
  });

  document.getElementById("table-wrap").addEventListener("mouseleave", function() {
    tip.style.display = "none";
  });
})();
</script>
