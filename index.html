<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engagement Roadmap</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }

nav {
  display: flex;
  align-items: center;
  padding: 0 28px;
  background: #fff;
  border-bottom: 1px solid #d4cec4;
  height: 44px;
}
.nav-brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #1a1a1a;
  margin-right: 24px;
  text-decoration: none;
}
.nav-tab {
  display: inline-flex;
  align-items: center;
  height: 44px;
  padding: 0 16px;
  font-size: 12px;
  font-family: inherit;
  color: #666;
  text-decoration: none;
  border-bottom: 2px solid transparent;
  transition: color 0.12s, border-color 0.12s;
  letter-spacing: 0.02em;
}
.nav-tab:hover { color: #1a1a1a; }
.nav-tab.active {
  color: #E3120B;
  border-bottom-color: #E3120B;
  font-weight: 600;
}

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: #f2ede3;
  color: #1a1a1a;
  padding: 0;
  min-height: 100vh;
  font-size: 14px;
}

.page-content {
  padding: 24px 28px;
}

.page-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 20px;
}

h1 {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #1a1a1a;
}

.subtitle {
  font-size: 12px;
  color: #888;
  font-style: italic;
}

.controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 7px;
}
.filter-label {
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
select {
  padding: 7px 10px;
  border: 1px solid #c8c0b0;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: #fff;
  color: #1a1a1a;
  cursor: pointer;
}
select:focus { outline: 1px solid #E3120B; }


.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  background: #faf7f0;
  border: 1px solid #c8c0b0;
  table-layout: fixed;
}

col.lane-col    { width: 180px; }
col.horizon-col { width: auto; }

thead tr th {
  padding: 10px 14px;
  text-align: left;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  background: #f2ede3;
  border-bottom: 1px solid #c8c0b0;
  vertical-align: bottom;
}

th.h-now     { color: #2f7a2f; border-top: 3px solid #2f7a2f; }
th.h-next    { color: #b86d00; border-top: 3px solid #b86d00; }
th.h-later   { color: #E3120B; border-top: 3px solid #E3120B; }
th.h-lane    { color: #1a1a1a; border-top: 3px solid transparent; }

tbody tr { border-bottom: 1px dashed #c8c0b0; }
tbody tr:last-child { border-bottom: none; }

/* Zone header rows */
td.zone-header {
  padding: 9px 16px;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #fff;
  background: #1a1a1a;
  border-top: 2px solid #c8c0b0;
  border-bottom: none;
}
td.zone-header.z-strategic    { border-left: 5px solid #E3120B; }
td.zone-header.z-operational  { border-left: 5px solid #2f7a2f; }
td.zone-header.z-enterprise   { border-left: 5px solid #b86d00; }

tr.zone-row td.lane-cell { background: #f5f0e8; }

td.lane-cell {
  padding: 11px 14px;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  vertical-align: top;
  border-right: 1px solid #c8c0b0;
  background: #f2ede3;
  white-space: normal;
  word-wrap: break-word;
  color: #444;
}

/* Zone-tinted lane cells */
.zone-strategic  td.lane-cell { border-left: 3px solid #E3120B; }
.zone-operational td.lane-cell { border-left: 3px solid #2f7a2f; }
.zone-enterprise td.lane-cell { border-left: 3px solid #b86d00; }

.lane-count {
  display: inline-block;
  background: #ddd8cc;
  color: #777;
  font-size: 10px;
  font-weight: normal;
  padding: 1px 5px;
  border-radius: 9px;
  margin-left: 4px;
  vertical-align: middle;
}

td.feat-cell {
  padding: 11px 14px;
  vertical-align: top;
  border-right: 1px solid #e0d9cc;
}
td.feat-cell:last-child { border-right: none; }

.feat {
  font-size: 12.5px;
  line-height: 1.45;
  color: #1a1a1a;
  margin-bottom: 5px;
  padding-bottom: 5px;
  border-bottom: 1px solid #ece6d8;
}
.feat:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

.tag-pill {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 9px;
  margin-right: 5px;
  font-style: normal;
  font-weight: 600;
  letter-spacing: 0.01em;
  vertical-align: middle;
  white-space: nowrap;
}

/* Team pills */
.pill-web  { background: #ddeeff; color: #2255aa; }
.pill-disc { background: #eeddf5; color: #7733aa; }
.pill-core { background: #ddf5ee; color: #226644; }
.pill-av   { background: #fff0dd; color: #aa5500; }
.pill-ads  { background: #fff5dd; color: #886600; }

/* KR tooltip */
.feat { cursor: default; }

#feat-card {
  position: fixed;
  z-index: 9999;
  pointer-events: none;
  display: none;
  width: 310px;
  background: #fff;
  border-radius: 5px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.16);
  border-top: 3px solid #888;
  overflow: hidden;
}
#feat-card.fc-strategic   { border-top-color: #E3120B; }
#feat-card.fc-operational { border-top-color: #2f7a2f; }
#feat-card.fc-enterprise  { border-top-color: #b86d00; }
.feat-card-body { padding: 11px 13px 12px; }
.feat-card-name {
  font-size: 11.5px;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 7px;
  line-height: 1.4;
}
.feat-card-summary {
  font-size: 11.5px;
  color: #333;
  line-height: 1.55;
}
.feat-card-kr {
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px solid #ece6d8;
}
.feat-card-kr-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #E3120B;
  margin-bottom: 3px;
}
.feat-card-kr-text {
  font-size: 11px;
  color: #666;
  line-height: 1.45;
}
.feat-card-comment {
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid #ece6d8;
}
.feat-card-comment-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 3px;
}
.feat-card-comment-text {
  font-size: 11px;
  color: #666;
  line-height: 1.45;
  font-style: italic;
}
</style>

// ─── HORIZON CONFIG ────────────────────────────────────────────────────────
const HORIZONS_BASE = [
  { key:"Now",    label:"Now (June–July)",    thcls:"h-now"  },
  { key:"Next",   label:"Next (August)",      thcls:"h-next" },
  { key:"Later",  label:"Later (Sept–Oct–Nov)", thcls:"h-later"}
];

// ─── TEAM PILLS ───────────────────────────────────────────────────────────
const TEAM_PILL = {
  "Web, NL, GenAI":              ["pill-web",  "Web"],
  "Discovery & Personalisation": ["pill-disc", "D&P"],
  "Core App":                    ["pill-core", "App"],
  "Audio & Video":               ["pill-av",   "A&V"],
  "Advertising":                 ["pill-ads",  "Ads"]

// ─── RENDER ───────────────────────────────────────────────────────────────
function render() {
  var selTeam = document.getElementById("team-select").value;
  var selObj  = document.getElementById("obj-select").value;
  var horizons = HORIZONS_BASE;

  var colgroup = "<colgroup><col class=\"lane-col\">" +
    horizons.map(function() { return "<col class=\"horizon-col\">"; }).join("") +
    "</colgroup>";

  var headerRow = "<tr><th class=\"h-lane\"></th>" +
    horizons.map(function(h) {
      return "<th class=\"" + h.thcls + "\">" + h.label + "</th>";
    }).join("") +
    "</tr>";

  var bodyRows = "";
  var anyRow = false;

  ZONES.forEach(function(zone) {
    var zoneRows = "";

    zone.lanes.forEach(function(lane) {
      // If objective filter is active and this lane doesn't match, skip entirely
      if (selObj && lane !== selObj) return;

      var cells = horizons.map(function(h) {
        return DATA.filter(function(d) {
          return d.zone === zone.key &&
                 d.lane === lane &&
                 d.r    === h.key &&
                 (!selTeam || d.t === selTeam);
        });
      });

      var total = cells.reduce(function(s, c) { return s + c.length; }, 0);
      if (total === 0) return;

      var tds = cells.map(function(items) {
        if (!items.length) return "<td class=\"feat-cell\"></td>";
        var feats = items.map(function(item) {
          var pill = "";
          if (item.t) {
            var pd = TEAM_PILL[item.t] || ["", item.t];
            pill = "<span class=\"tag-pill " + pd[0] + "\">" + pd[1] + "</span>";
          }
          var krAttr  = item.kr ? " data-kr=\""  + item.kr.replace(/"/g, "&quot;") + "\"" : "";
          var sumAttr = item.s  ? " data-s=\""   + item.s.replace(/"/g, "&quot;")  + "\"" : "";
          var cAttr   = item.c  ? " data-c=\""   + item.c.replace(/"/g, "&quot;")  + "\"" : "";
          var zAttr   = " data-zone=\"" + zone.key.toLowerCase() + "\"";
          var nameAttr = " data-name=\"" + item.f.replace(/"/g, "&quot;") + "\"";
          return "<div class=\"feat\"" + krAttr + sumAttr + cAttr + zAttr + nameAttr + ">" + pill + item.f + "</div>";
        }).join("");
        return "<td class=\"feat-cell\">" + feats + "</td>";
      }).join("");

      zoneRows += "<tr class=\"" + zone.rowcls + "\"><td class=\"lane-cell\">" +
        lane + "<span class=\"lane-count\">" + total + "</span></td>" + tds + "</tr>";
    });

    // Only render zone header if it has visible lanes
    if (zoneRows) {
      bodyRows += "<tr><td class=\"zone-header " + zone.cls + "\" colspan=\"" +
        (horizons.length + 1) + "\">" + zone.label + "</td></tr>";
      bodyRows += zoneRows;
      anyRow = true;
    }
  });

  if (!anyRow) {
    bodyRows = "<tr><td class=\"feat-cell\" style=\"padding:40px;text-align:center;color:#aaa;font-style:italic;\" colspan=\"" +
      (horizons.length + 1) + "\">No features match the current filter.</td></tr>";
  }

  document.getElementById("table-wrap").innerHTML =
    "<table>" + colgroup + "<thead>" + headerRow + "</thead><tbody>" + bodyRows + "</tbody></table>";
}

document.getElementById("team-select").addEventListener("change", render);
document.getElementById("obj-select").addEventListener("change", render);
render();

// ─── FEATURE HOVER CARD ───────────────────────────────────────────────────
(function() {
  var card   = document.getElementById("feat-card");
  var elName = card.querySelector(".feat-card-name");
  var elSum  = card.querySelector(".feat-card-summary");
  var elKrWrap = card.querySelector(".feat-card-kr");
  var elKr   = card.querySelector(".feat-card-kr-text");
  var OFFSET = 14;
  var CARD_W = 318;
  var CARD_H = 140; // approximate

  function showCard(e, el) {
    var name  = el.dataset.name || "";
    var sum   = el.dataset.s   || "";
    var kr    = el.dataset.kr  || "";
    var com   = el.dataset.c   || "";
    var zone  = el.dataset.zone || "";

    if (!sum && !kr && !com) { card.style.display = "none"; return; }

    elName.textContent = name;
    elSum.textContent  = sum || "";
    elSum.style.display = sum ? "" : "none";

    if (kr) {
      elKr.textContent = kr;
      elKrWrap.style.display = "";
    } else {
      elKrWrap.style.display = "none";
    }

    var elComWrap = card.querySelector(".feat-card-comment");
    var elCom     = card.querySelector(".feat-card-comment-text");
    if (com) {
      elCom.textContent = com;
      elComWrap.style.display = "";
    } else {
      elComWrap.style.display = "none";
    }

    card.className = zone ? "fc-" + zone : "";
    card.style.display = "block";
    posCard(e);
  }

  function posCard(e) {
    var x = e.clientX + OFFSET;
    var y = e.clientY + OFFSET;
    if (x + CARD_W > window.innerWidth)  x = e.clientX - CARD_W - OFFSET;
    if (y + CARD_H > window.innerHeight) y = e.clientY - CARD_H - OFFSET;
    card.style.left = x + "px";
    card.style.top  = y + "px";
  }

  document.getElementById("table-wrap").addEventListener("mouseover", function(e) {
    var el = e.target.closest(".feat");
    if (!el) return;
    showCard(e, el);
  });

  document.getElementById("table-wrap").addEventListener("mousemove", function(e) {
    var el = e.target.closest(".feat");
    if (!el) { card.style.display = "none"; return; }
    posCard(e);
  });

  document.getElementById("table-wrap").addEventListener("mouseleave", function() {
    card.style.display = "none";
  });
})();
</script>
