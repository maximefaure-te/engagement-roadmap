<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eCommerce Roadmap</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }

nav {
  display: flex;
  align-items: center;
  padding: 0 28px;
  background: #fff;
  border-bottom: 1px solid #d4cec4;
  height: 44px;
}
.nav-brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #1a1a1a;
  margin-right: 24px;
  text-decoration: none;
}
.nav-tab {
  display: inline-flex;
  align-items: center;
  height: 44px;
  padding: 0 16px;
  font-size: 12px;
  font-family: inherit;
  color: #666;
  text-decoration: none;
  border-bottom: 2px solid transparent;
  transition: color 0.12s, border-color 0.12s;
  letter-spacing: 0.02em;
}
.nav-tab:hover { color: #1a1a1a; }
.nav-tab.active {
  color: #E3120B;
  border-bottom-color: #E3120B;
  font-weight: 600;
}

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: #f2ede3;
  color: #1a1a1a;
  padding: 0;
  min-height: 100vh;
  font-size: 14px;
}

.page-content {
  padding: 24px 28px;
}

.page-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 20px;
}

h1 {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #1a1a1a;
}

.subtitle {
  font-size: 12px;
  color: #888;
  font-style: italic;
}

.controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 7px;
}
.filter-label {
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
select {
  padding: 7px 10px;
  border: 1px solid #c8c0b0;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: #fff;
  color: #1a1a1a;
  cursor: pointer;
}
select:focus { outline: 1px solid #E3120B; }

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  background: #faf7f0;
  border: 1px solid #c8c0b0;
  table-layout: fixed;
}

col.lane-col    { width: 200px; }
col.horizon-col { width: auto; }

thead tr th {
  padding: 10px 14px;
  text-align: left;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  background: #f2ede3;
  border-bottom: 1px solid #c8c0b0;
  vertical-align: bottom;
}

th.h-now     { color: #2f7a2f; border-top: 3px solid #2f7a2f; }
th.h-next    { color: #b86d00; border-top: 3px solid #b86d00; }
th.h-later   { color: #E3120B; border-top: 3px solid #E3120B; }
th.h-lane    { color: #1a1a1a; border-top: 3px solid transparent; }

tbody tr { border-bottom: 1px dashed #c8c0b0; }
tbody tr:last-child { border-bottom: none; }

td.lane-cell {
  padding: 11px 14px;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  vertical-align: top;
  border-right: 1px solid #c8c0b0;
  background: #f2ede3;
  white-space: normal;
  word-wrap: break-word;
  color: #444;
  border-left: 3px solid #c8c0b0;
}

.lane-count {
  display: inline-block;
  background: #ddd8cc;
  color: #777;
  font-size: 10px;
  font-weight: normal;
  padding: 1px 5px;
  border-radius: 9px;
  margin-left: 4px;
  vertical-align: middle;
}

td.feat-cell {
  padding: 11px 14px;
  vertical-align: top;
  border-right: 1px solid #e0d9cc;
}
td.feat-cell:last-child { border-right: none; }

.feat {
  font-size: 12.5px;
  line-height: 1.45;
  color: #1a1a1a;
  margin-bottom: 5px;
  padding-bottom: 5px;
  border-bottom: 1px solid #ece6d8;
}
.feat:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

.tag-pill {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 9px;
  margin-right: 5px;
  font-style: normal;
  font-weight: 600;
  letter-spacing: 0.01em;
  vertical-align: middle;
  white-space: nowrap;
}

/* Team pills — eCom */
.pill-growth  { background: #ddf5ee; color: #226644; }
.pill-ia      { background: #eeddf5; color: #7733aa; }
.pill-cp      { background: #ddeeff; color: #2255aa; }
.pill-inlife  { background: #fff0dd; color: #aa5500; }
.pill-cops    { background: #fff5dd; color: #886600; }
.pill-apps    { background: #fce4ec; color: #b71c1c; }

/* Ticket link */
.ticket-link {
  display: inline-block;
  font-size: 9.5px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 5px;
  font-weight: 500;
  vertical-align: middle;
  white-space: nowrap;
  color: #888;
  background: #ece6d8;
  text-decoration: none;
  letter-spacing: 0.01em;
}
.ticket-link:hover { color: #1a1a1a; background: #d4cec4; }

</style>
</head>
<body>

<nav>
  <span class="nav-brand">The Economist</span>
  <a href="index.html"  class="nav-tab">Engagement Roadmap</a>
  <a href="mapping.html" class="nav-tab">Goals &amp; Teams</a>
  <a href="ecom.html"   class="nav-tab active">eCommerce Roadmap</a>
</nav>

<div class="page-content">
<div class="page-header">
  <h1>eCommerce &amp; Subscriptions — Roadmap</h1>
  <span class="subtitle">Goals · Now · Next · Later</span>
</div>

<div class="controls">
  <div class="filter-group">
    <span class="filter-label">Team</span>
    <select id="team-select">
      <option value="">All teams</option>
      <option>Growth</option>
      <option>Identity &amp; Access</option>
      <option>Commerce Platforms</option>
      <option>In-life</option>
      <option>Commerce Ops</option>
      <option>Apps</option>
    </select>
  </div>

  <div class="filter-group">
    <span class="filter-label">Goal</span>
    <select id="goal-select">
      <option value="">All goals</option>
      <option>Improve CVR (web/app)</option>
      <option>Tiering</option>
      <option>Reduce churn through personalisation</option>
      <option>Involuntary Churn</option>
      <option>Revenue Retained</option>
      <option>Limio Replacement</option>
      <option>Drive Platform Excellence</option>
      <option>Drive Greater Self-Service Adoption</option>
    </select>
  </div>
</div>

<div class="table-wrap" id="table-wrap"></div>

<script>
var JIRA_BASE = "https://economist.atlassian.net/browse/";

var DATA = [];

// Goal display order
var GOALS = [
  "Improve CVR (web/app)",
  "Tiering",
  "Reduce churn through personalisation",
  "Involuntary Churn",
  "Revenue Retained",
  "Limio Replacement",
  "Drive Platform Excellence",
  "Drive Greater Self-Service Adoption"
];

// Horizon config
var HORIZONS = [
  { key: "Now",   label: "Now",   thcls: "h-now"   },
  { key: "Next",  label: "Next",  thcls: "h-next"  },
  { key: "Later", label: "Later", thcls: "h-later" }
];

// Team pill config
var TEAM_PILL = {
  "Growth":               ["pill-growth", "Growth"],
  "Identity & Access":    ["pill-ia",     "I&A"],
  "Commerce Platforms":   ["pill-cp",     "Cmrc"],
  "In-life":              ["pill-inlife", "In-life"],
  "Commerce Ops":         ["pill-cops",   "Ops"],
  "Apps":                 ["pill-apps",   "Apps"]
};

function render() {
  var selTeam = document.getElementById("team-select").value;
  var selGoal = document.getElementById("goal-select").value;

  var colgroup = "<colgroup><col class=\"lane-col\">" +
    HORIZONS.map(function() { return "<col class=\"horizon-col\">"; }).join("") +
    "</colgroup>";

  var headerRow = "<tr><th class=\"h-lane\">Goal</th>" +
    HORIZONS.map(function(h) {
      return "<th class=\"" + h.thcls + "\">" + h.label + "</th>";
    }).join("") +
    "</tr>";

  var bodyRows = "";
  var anyRow = false;

  GOALS.forEach(function(goal) {
    if (selGoal && goal !== selGoal) return;

    var cells = HORIZONS.map(function(h) {
      return DATA.filter(function(d) {
        return d.lane === goal &&
               d.r    === h.key &&
               (!selTeam || d.t === selTeam);
      });
    });

    var total = cells.reduce(function(s, c) { return s + c.length; }, 0);
    if (total === 0) return;

    var tds = cells.map(function(items) {
      if (!items.length) return "<td class=\"feat-cell\"></td>";
      var feats = items.map(function(item) {
        var pill = "";
        if (item.t) {
          var pd = TEAM_PILL[item.t] || ["", item.t];
          pill = "<span class=\"tag-pill " + pd[0] + "\">" + pd[1] + "</span>";
        }
        var ticketLink = item.ticket
          ? "<a class=\"ticket-link\" href=\"" + JIRA_BASE + item.ticket + "\" target=\"_blank\" rel=\"noopener\">" + item.ticket + "</a>"
          : "";
        return "<div class=\"feat\">" + pill + item.f + ticketLink + "</div>";
      }).join("");
      return "<td class=\"feat-cell\">" + feats + "</td>";
    }).join("");

    bodyRows += "<tr><td class=\"lane-cell\">" +
      goal + "<span class=\"lane-count\">" + total + "</span></td>" + tds + "</tr>";
    anyRow = true;
  });

  if (!anyRow) {
    bodyRows = "<tr><td class=\"feat-cell\" style=\"padding:40px;text-align:center;color:#aaa;font-style:italic;\" colspan=\"" +
      (HORIZONS.length + 1) + "\">No features match the current filter.</td></tr>";
  }

  document.getElementById("table-wrap").innerHTML =
    "<table>" + colgroup + "<thead>" + headerRow + "</thead><tbody>" + bodyRows + "</tbody></table>";
}

fetch("ecom_data.json")
  .then(function(r) { return r.json(); })
  .then(function(data) {
    DATA = data;
    document.getElementById("team-select").addEventListener("change", render);
    document.getElementById("goal-select").addEventListener("change", render);
    render();
  })
  .catch(function(err) {
    document.getElementById("table-wrap").innerHTML =
      '<p style="padding:40px;color:#c00">Failed to load ecom_data.json: ' + err + '</p>';
  });
</script>
</div>
</body>
</html>
