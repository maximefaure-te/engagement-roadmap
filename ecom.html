<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eCommerce Roadmap</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: #f2ede3;
  color: #1a1a1a;
  font-size: 14px;
  min-height: 100vh;
}

/* ── Nav ─────────────────────────────────────────────────── */
nav {
  display: flex;
  align-items: center;
  padding: 0 28px;
  background: #fff;
  border-bottom: 1px solid #d4cec4;
  height: 44px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #1a1a1a;
  margin-right: 24px;
  text-decoration: none;
}
.nav-tab {
  display: inline-flex;
  align-items: center;
  height: 44px;
  padding: 0 16px;
  font-size: 12px;
  color: #666;
  text-decoration: none;
  border-bottom: 2px solid transparent;
  letter-spacing: 0.02em;
  transition: color 0.12s;
}
.nav-tab:hover { color: #1a1a1a; }
.nav-tab.active {
  color: #E3120B;
  border-bottom-color: #E3120B;
  font-weight: 600;
}

/* ── Page layout ──────────────────────────────────────────── */
.page-content { padding: 24px 28px; max-width: 1400px; }
.page-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 20px;
}
h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #1a1a1a;
}
.issue-count { font-size: 12px; color: #999; font-style: italic; }

/* ── Team filter pills ────────────────────────────────────── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 11px;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-right: 2px;
}
.fp {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: opacity 0.15s;
  user-select: none;
}
.fp         { opacity: 0.35; }
.fp.active  { opacity: 1; }
.fp-inlife  { background: #DFF4F5; color: #0D7E85; border-color: #7DCDD1; }
.fp-cp      { background: #EDE9FC; color: #5C3D9E; border-color: #B3A5ED; }
.fp-martech { background: #E2F2E9; color: #2E7A4B; border-color: #88C9A4; }
.fp-growth  { background: #FAEADB; color: #B84010; border-color: #F5A07A; }

/* ── Delivered toggle ──────────────────────────────────────── */
.delivered-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: #aaa;
  cursor: pointer;
  user-select: none;
  margin-bottom: 20px;
  padding: 3px 0;
  border: none;
  background: none;
}
.delivered-toggle:hover { color: #555; }
.delivered-toggle svg { flex-shrink: 0; }

/* Hide/show delivered column */
.col-delivered { display: none; }
.rm-grid-header { display: grid; grid-template-columns: 120px 1fr 1fr 1fr; }
.rm-lane        { grid-template-columns: 120px 1fr 1fr 1fr; }
#rm.show-delivered .rm-grid-header { grid-template-columns: 120px 1fr 1fr 1fr 1fr; }
#rm.show-delivered .rm-lane        { grid-template-columns: 120px 1fr 1fr 1fr 1fr; }
#rm.show-delivered .col-delivered  { display: block; }

/* ── Grid ──────────────────────────────────────────────────── */
.rm-grid {
  border: 1px solid #c8c0b0;
  border-top: none;
  border-radius: 0 0 6px 6px;
  overflow: hidden;
  margin-bottom: 0;
}
.rm-grid-header {
  background: #fff;
  border-bottom: 1px solid #d4cec4;
}

/* Grid header — same bg-colour style as E&E */
.grid-header-wrap {
  border: 1px solid #c8c0b0;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  overflow: hidden;
}
.rm-gh {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: #aaa;
  padding: 7px 10px;
  border-right: 1px solid #e8e2d8;
}
.rm-gh:last-child { border-right: none; }
.rm-gh.h-now   { color: #7a5800; background: #fef9e6; }
.rm-gh.h-next  { color: #a02020; background: #fdf0f0; }
.rm-gh.h-later { color: #888;    background: #f5f5f5; }
.rm-gh.h-done  { color: #2a7a2a; background: #f0f7f0; }

.rm-lane {
  display: grid;
  border-top: 1px solid #d4cec4;
}
.rm-lane-name {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.07em;
  color: #fff;
  padding: 10px 10px;
  background: #2a2a2a;
  border-right: 1px solid #444;
  line-height: 1.4;
  text-transform: uppercase;
  display: flex;
  align-items: flex-start;
}
.rm-cell {
  padding: 6px 8px;
  border-right: 1px solid #e8e2d8;
  min-height: 38px;
  background: #fff;
}
.rm-cell:last-child { border-right: none; }
.rm-cell.later-cell { background: #faf8f4; }
.rm-cell.done-cell  { background: #f5f5f5; }

/* ── Feature cards ─────────────────────────────────────────── */
.feature {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 7px;
  padding: 5px 0;
  border-bottom: 1px solid #f0ebe2;
}
.feature:last-child { border-bottom: none; }
.feature.hidden { display: none; }

/* Team dot */
.team-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}
.dot-inlife  { background: #0D7E85; }
.dot-cp      { background: #5C3D9E; }
.dot-martech { background: #2E7A4B; }
.dot-growth  { background: #B84010; }

.fname {
  flex: 1;
  min-width: 0;
  font-size: 11.5px;
  color: #1a1a1a;
  line-height: 1.45;
  text-decoration: none;
}
.fname:hover { color: #E3120B; }

.pills {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  flex-shrink: 0;
}
.pill {
  display: inline-block;
  font-size: 9px;
  font-weight: 600;
  padding: 1px 4px;
  border-radius: 8px;
  line-height: 1.6;
  white-space: nowrap;
}
.p-green { background: #d4edda; color: #1a6b2a; }
.p-amber { background: #fff3cd; color: #7a5800; }
.p-red   { background: #fde8e8; color: #a02020; }
.p-done  { background: #e8f0fe; color: #1a56b0; }
.p-date  { background: #f0ebe2; color: #888; }

.empty { color: #ccc; font-size: 10px; }

/* ── Tooltip ─────────────────────────────────────────────── */
#tooltip {
  position: fixed;
  background: #fff;
  border: 1px solid #e0dbd3;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 11px;
  line-height: 1.5;
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  z-index: 9999;
  pointer-events: none;
  max-width: 230px;
  display: none;
}
#tooltip.visible { display: block; }
.tt-row { display: flex; gap: 6px; margin-bottom: 3px; }
.tt-row:last-child { margin-bottom: 0; }
.tt-label { font-size: 9px; font-weight: 700; letter-spacing: 0.07em; color: #aaa; text-transform: uppercase; min-width: 52px; padding-top: 1px; }
.tt-val { color: #1a1a1a; }
.tt-val.tt-empty { color: #ccc; font-style: italic; }
.tt-divider { border: none; border-top: 1px solid #ede8df; margin: 8px 0; }
</style>
</head>

<div id="tooltip"></div>

<nav>

</div>

const TT = document.getElementById('tooltip');

function ttVal(v) {
  return v ? `<span class="tt-val">${v}</span>` : `<span class="tt-val tt-empty">—</span>`;
}
function showTooltip(e, d) {
  const ragBadge = d.rag
    ? `<span class="pill p-${RAG_CLS[d.rag]}">${d.rag}</span>`
    : `<span class="tt-val tt-empty">—</span>`;
  TT.innerHTML = `
    <div class="tt-row"><span class="tt-label">Status</span>${ttVal(d.st)}</div>
    <div class="tt-row"><span class="tt-label">RAG</span>${ragBadge}</div>
    <div class="tt-row"><span class="tt-label">Release</span>${ttVal(d.date)}</div>
    <hr class="tt-divider">
    <div class="tt-row"><span class="tt-label">Notes</span>${ttVal(d.dn)}</div>
  `;
  TT.classList.add('visible');
  placeTooltip(e);
}
function placeTooltip(e) {
  const TW = 230, PAD = 12;
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = e.clientX + PAD;
  let y = e.clientY - 10;
  if (x + TW > vw - 8) x = e.clientX - TW - PAD;
  const th = TT.offsetHeight;
  if (y + th > vh - 8) y = vh - th - 8;
  TT.style.left = x + 'px';
  TT.style.top  = y + 'px';
}
function hideTooltip() { TT.classList.remove('visible'); }

function featureEl(d) {
  const wrap = document.createElement('div');
  wrap.className = 'feature';
  wrap.dataset.team = d.t;
  const tc = TEAM_CLS[d.t] || 'growth';
  const rc = RAG_CLS[d.rag];
  const dot = document.createElement('span');
  dot.className = `team-dot dot-${tc}`;
  const a = document.createElement('a');
  a.className = 'fname';
  a.href = JIRA_BASE + d.ticket;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = d.f;
  const pillsEl = document.createElement('div');
  pillsEl.className = 'pills';
  let html = '';
  if (rc) html += `<span class="pill p-${rc}">${d.rag}</span>`;
  if (d.date) {
    const parts = d.date.slice(5).split('-');
    html += `<span class="pill p-date">${parts[1]}/${parts[0]}</span>`;
  }
  pillsEl.innerHTML = html;
  wrap.appendChild(dot);
  wrap.appendChild(a);
  wrap.appendChild(pillsEl);
  wrap.addEventListener('mouseenter', (e) => showTooltip(e, d));
  wrap.addEventListener('mousemove',  (e) => placeTooltip(e));
  wrap.addEventListener('mouseleave', hideTooltip);
  return wrap;
}

function render() {
  const rm = document.getElementById('rm');
  rm.innerHTML = '';
  const wtOk = d => !d.wt || d.wt === 'Delivery' || d.wt === 'Both';
  const isDelivered = d => d.st === 'Done' || d.st === 'Monitor';
  const notDelivered = d => !isDelivered(d);

  const hasAny = LANES.some(lane => {
    const t = LANE_TEAM[lane];
    return active.has(t) && DATA.some(d => d.lane === lane && wtOk(d));
  });
  if (!hasAny) return;

  const grid = document.createElement('div');
  grid.className = 'rm-grid';
  const hdr = document.createElement('div');
  hdr.className = 'rm-grid-header';
  hdr.innerHTML = '<div class="rm-gh"></div><div class="rm-gh h-done col-delivered">Delivered</div><div class="rm-gh h-now">Now</div><div class="rm-gh h-next">Next</div><div class="rm-gh h-later">Later</div>';
  grid.appendChild(hdr);

  LANES.forEach(lane => {
    const t = LANE_TEAM[lane];
    if (!active.has(t)) return;
    const nowItems   = DATA.filter(d => d.lane === lane && d.r === 'Now'   && wtOk(d) && notDelivered(d));
    const nextItems  = DATA.filter(d => d.lane === lane && d.r === 'Next'  && wtOk(d) && notDelivered(d));
    const laterItems = DATA.filter(d => d.lane === lane && d.r === 'Later' && wtOk(d) && notDelivered(d));
    const doneItems  = DATA.filter(d => d.lane === lane && isDelivered(d)  && wtOk(d));
    if (!nowItems.length && !nextItems.length && !laterItems.length && !doneItems.length) return;

    const row = document.createElement('div');
    row.className = 'rm-lane';
    const lnDiv = document.createElement('div');
    lnDiv.className = 'rm-lane-name';
    lnDiv.textContent = lane;
    const nowDiv  = document.createElement('div'); nowDiv.className  = 'rm-cell';
    const nxtDiv  = document.createElement('div'); nxtDiv.className  = 'rm-cell';
    const latDiv  = document.createElement('div'); latDiv.className  = 'rm-cell later-cell';
    const doneDiv = document.createElement('div'); doneDiv.className = 'rm-cell done-cell col-delivered';

    [[nowItems, nowDiv],[nextItems, nxtDiv],[laterItems, latDiv],[doneItems, doneDiv]].forEach(([items, cell]) => {
      if (!items.length) {
        cell.innerHTML = '<span class="empty">—</span>';
      } else {
        items.forEach(d => { cell.appendChild(featureEl(d)); });
      }
    });

    row.appendChild(lnDiv);
    row.appendChild(doneDiv);
    row.appendChild(nowDiv);
    row.appendChild(nxtDiv);
    row.appendChild(latDiv);
    grid.appendChild(row);
  });

  rm.appendChild(grid);
  updateCount();
}

function updateCount() {
  const wtOk = d => !d.wt || d.wt === 'Delivery' || d.wt === 'Both';
  const vis = DATA.filter(d => active.has(d.t) && wtOk(d));
  document.getElementById('issue-count').textContent =
    `${vis.length} issues · ${vis.filter(d => d.r === 'Now').length} Now · ${vis.filter(d => d.r === 'Next').length} Next`;
}

let deliveredVisible = false;
function toggleDelivered() {
  deliveredVisible = !deliveredVisible;
  document.getElementById('rm').classList.toggle('show-delivered', deliveredVisible);
  document.getElementById('delivered-label').textContent = deliveredVisible ? 'Hide Delivered' : 'Show Delivered';
}

function toggle(el) {
  const t = el.dataset.t;
  if (active.has(t) && active.size === 1) return;
  if (active.has(t)) { active.delete(t); el.classList.remove('active'); }
  else { active.add(t); el.classList.add('active'); }
  render();
}

render();
</script>
